<svg
  viewBox="0 0 1600 400"
  preserveAspectRatio="xMidYMid slice"
  xmlns="http://www.w3.org/2000/svg"
>
  <title>Folio default portfolio cover</title>
  <defs>
    <linearGradient id="folio-cover-bg" x1="80" y1="20" x2="1520" y2="380" gradientUnits="userSpaceOnUse">
      <stop stop-color="#30206F"/>
      <stop offset="0.48" stop-color="#5037C9"/>
      <stop offset="1" stop-color="#7561E8"/>
    </linearGradient>
    <radialGradient id="folio-cover-glow" cx="0" cy="0" r="1" gradientTransform="translate(800 204) rotate(90) scale(255 520)" gradientUnits="userSpaceOnUse">
      <stop stop-color="#FAF7EF" stop-opacity="0.22"/>
      <stop offset="1" stop-color="#FAF7EF" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="folio-cover-ribbon" x1="104" y1="76" x2="1496" y2="326" gradientUnits="userSpaceOnUse">
